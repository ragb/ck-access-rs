name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  native:
    name: Native (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux MIDI deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Verify schemas/ are up to date
        # If this step fails locally, run:
        #   cargo run --release --bin ck -- schema system   > schemas/ck-system.schema.json
        #   cargo run --release --bin ck -- schema live-set > schemas/ck-live-set.schema.json
        # and commit the result.
        run: |
          cargo run --release --bin ck --locked -- schema system   > /tmp/system.schema.json
          cargo run --release --bin ck --locked -- schema live-set > /tmp/live-set.schema.json
          diff -u schemas/ck-system.schema.json   /tmp/system.schema.json
          diff -u schemas/ck-live-set.schema.json /tmp/live-set.schema.json

  wasm:
    name: WASM bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned, not `latest`: the action resolves `latest` from the GitHub API
          # and silently falls back to v0.9.1 when that lookup is rate-limited.
          # v0.9.1 predates Cargo workspace inheritance and dies on
          # `repository.workspace = true` with "invalid type: map, expected a
          # string" — a green build one minute and a red one the next.
          version: "v0.15.0"

      - name: wasm-pack test (Node)
        working-directory: ck-wasm
        run: wasm-pack test --node

      - name: wasm-pack build (web)
        working-directory: ck-wasm
        run: wasm-pack build --target web --release

      - name: Upload pkg/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: ck-wasm-pkg
          path: ck-wasm/pkg/
          if-no-files-found: error
