[workspace]
resolver = "2"
members = ["ck-core", "ck", "ck-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ragb/ck-access-rs"
description = "Yamaha CK61 / CK88 SysEx codec, CLI, and WASM bindings."

[workspace.dependencies]
ck-core = { path = "ck-core" }
# Shared foundation crates. Temporarily tracking the kit's `store`-hook branch
# until it merges and a new tag is cut; switch back to a version tag then:
#   midi-access-core = { git = "https://github.com/ragb/midi-access-kit", tag = "v0.2.0" }
#   midi-access-cli  = { git = "https://github.com/ragb/midi-access-kit", tag = "v0.2.0" }
midi-access-core = { git = "https://github.com/ragb/midi-access-kit", branch = "add-device-store-hook" }
midi-access-cli = { git = "https://github.com/ragb/midi-access-kit", branch = "add-device-store-hook" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
midir = "0.10"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
schemars = "0.8"

[profile.release]
lto = "thin"
strip = true
