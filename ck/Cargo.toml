[package]
name = "ck"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for the Yamaha CK61/CK88 (dump/sync/diff/show/lint/schema/catalog/resolve)."

[[bin]]
name = "ck"
path = "src/main.rs"

[dependencies]
# The CLI is the generic engine; `ck` only wires its Device impl into `run`.
ck-core = { workspace = true, features = ["schema"] }
midi-access-cli = { workspace = true }
