[package]
name = "ck"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI + MCP server for the Yamaha CK61/CK88 (dump/sync/diff/show/lint/schema/catalog/resolve)."

[[bin]]
name = "ck"
path = "src/main.rs"

# Read-only MCP server for LLM-assisted preset authoring.
[[bin]]
name = "ck-mcp"
path = "src/bin/mcp.rs"

[dependencies]
# Both engines are generic; `ck` only wires its Device impl into them.
ck-core = { workspace = true, features = ["schema"] }
midi-access-cli = { workspace = true }
midi-access-mcp = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
